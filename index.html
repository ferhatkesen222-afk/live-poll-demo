<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Poll - interactive preview</title>
<style>
:root{--bg:#0b0820;--ink:#fff;--mut:#a9a3d6;--pink:#ff2e93;--cyan:#00e5ff;--yel:#ffd60a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;
 background:radial-gradient(circle at 20% 0,#3a1170 0,transparent 45%),radial-gradient(circle at 90% 100%,#0a4a7a 0,transparent 45%),var(--bg) fixed;padding:16px}
.wrap{max-width:560px;margin:0 auto}.wide{max-width:980px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:clamp(1.8rem,7vw,3rem);margin:.2em 0;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 18px var(--pink),0 0 40px #ff2e9355}
.title{font-size:clamp(1.3rem,5.5vw,2rem);text-align:center;margin:12px 0 18px;color:var(--yel);text-shadow:0 0 14px #ffd60a88}
.mut{color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(10,1fr);gap:10px}.wrap.vote{max-width:760px}}
.dot{aspect-ratio:1;border-radius:50%;border:0;font:inherit;font-size:clamp(.95rem,4.2vw,1.5rem);color:#fff;cursor:pointer;
 background:radial-gradient(circle at 32% 28%,hsl(var(--h) 100% 72%),hsl(var(--h) 90% 48%) 60%,hsl(var(--h) 90% 30%));
 box-shadow:0 0 10px hsl(var(--h) 100% 55% / .65),inset 0 -3px 6px #0005;text-shadow:0 0 3px #000c,0 1px 2px #000;transition:transform .12s}
.dot:active,.dot:hover{transform:scale(1.14)}
.grid.off .dot{opacity:.35;pointer-events:none}
input{width:100%;font:inherit;font-size:1.4rem;padding:16px;border-radius:14px;border:3px solid var(--cyan);background:#150f38;color:#fff;text-align:center;outline:none}
input:focus{box-shadow:0 0 18px var(--cyan)}
.btn{font:inherit;font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;padding:14px 22px;border:0;border-radius:14px;color:#fff;cursor:pointer;
 background:linear-gradient(135deg,var(--pink),#7a2cff);box-shadow:0 0 18px #ff2e9366;text-decoration:none;display:inline-block}
.btn.alt{background:linear-gradient(135deg,#00b4d8,#0077b6);box-shadow:0 0 18px #00e5ff44}
.btn.red{background:linear-gradient(135deg,#ff3b3b,#b3001b)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:#ffffff12;border:2px solid #ffffff22;border-radius:18px;padding:18px;margin:12px 0}
.lock{font-size:clamp(5rem,30vw,10rem);line-height:1;color:var(--cyan);text-shadow:0 0 30px var(--cyan)}
.err{color:#ff7a8a;min-height:1.4em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}.stat b{display:block;font-size:clamp(2.6rem,9vw,4.5rem);color:var(--cyan);text-shadow:0 0 20px #00e5ff77}
.chip{display:inline-block;padding:6px 12px;margin:3px;border-radius:99px;background:#ffffff1a;font-size:.95rem}.chip.ok{background:#16a34a88}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid #ffffff22}
.qr{background:#fff;padding:14px;border-radius:18px;width:min(86vw,440px);box-shadow:0 0 40px var(--cyan)}.qr svg{display:block;width:100%;height:auto}
.url{color:var(--yel);word-break:break-all;font-size:1.2rem}

.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start;max-width:1100px;margin:0 auto}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.phone{border:8px solid #2a2350;border-radius:36px;padding:14px;background:#0d0a26cc;min-height:560px;box-shadow:0 0 40px #7a2cff55}
.tag{text-align:center;color:var(--cyan);text-transform:uppercase;letter-spacing:.12em;font-size:.85rem;margin:0 0 8px}
.top{text-align:center;max-width:1100px;margin:0 auto 12px}.top h1{margin:0}
.small{font-size:.95rem;padding:10px 14px}
</style>
<body>
<div class="top"><h1>Live Poll</h1><p class="mut">Interactive preview - no server needed. Left: what a participant sees on a phone. Right: the admin panel (only place with live counts).</p></div>
<div class="cols">
 <div><p class="tag">Participant (phone)</p><div class="phone" id="phone"></div></div>
 <div><p class="tag">Admin panel</p>
  <div class="card"><div class="mut" id="n"></div><div class="title" id="t" style="margin:6px 0"></div>
   <div class="row"><button class="btn small" id="next">Next Poll</button><button class="btn red small" id="close">Close Poll</button>
   <button class="btn alt small" id="sim">+20 simulated voters</button></div></div>
  <div class="stats"><div class="card stat"><span class="mut">Votes</span><b id="c">0</b><span class="mut" id="j"></span></div>
   <div class="card stat"><span class="mut">Average</span><b id="a">-</b></div></div>
  <div class="card"><div class="row"><button class="btn alt small" id="csv">Download CSV</button>
   <button class="btn small" id="reset" style="background:#ffffff22;box-shadow:none">Reset demo</button></div>
   <p class="mut" style="margin:0;text-align:center;font-size:.85rem">The full app also exports a real Excel (.xlsx) file.</p></div>
  <div class="card"><div class="mut">Participants</div><div id="p"></div></div>
 </div>
</div>
<script>
const TITLES=['How excited are you for today?','How was the opening session?','How likely are you to recommend this event?','How good was the lunch?','Rate the event overall'];
const NAMES=['Ava','Mert','Lena','Omar','Zoe','Can','Mia','Ravi','Ella','Deniz','Noah','Ece','Liam','Sofia','Kaan','Ines','Arda','Nora','Leo','Yara'];
const $=i=>document.getElementById(i), esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fresh=()=>({me:'',polls:[],people:[]}); // polls: {title,open,votes:{name:value}}
let S; try{S=JSON.parse(localStorage.lpPreview)}catch(e){} S=S&&S.polls?S:fresh();
const save=()=>{try{localStorage.lpPreview=JSON.stringify(S)}catch(e){}; draw();};
const cur=()=>S.polls[S.polls.length-1];
const avg=p=>{const v=Object.values(p.votes);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null};

function phone(){
  const v=$('phone'), p=cur();
  if(!S.me){v.innerHTML=`<div class="center" style="min-height:520px"><h1>Live Poll</h1><p class="mut">Type your name to join</p>
   <input id="nm" maxlength="30" placeholder="Your name"><p class="err" id="er"></p><button class="btn" id="go" style="width:100%">Join</button></div>`;
   $('go').onclick=()=>{const n=$('nm').value.trim();if(!n)return $('er').textContent='Please enter your name.';
    if(S.people.some(x=>x.toLowerCase()===n.toLowerCase()))return $('er').textContent='That name is already taken.';
    S.me=n;S.people.push(n);save();};return;}
  const head=`<p class="mut" style="text-align:center;margin:0">${esc(S.me)}</p>`;
  if(!p)return v.innerHTML=head+'<div class="center card"><h1>Get ready!</h1><p class="mut">Waiting for the first poll... (press Next Poll on the admin side)</p></div>';
  const mine=p.votes[S.me];
  if(mine!==undefined)return v.innerHTML=head+`<div class="center"><div class="title">${esc(p.title)}</div><div class="lock">${mine}</div><h1>Your vote is locked</h1><p class="mut">${p.open?'Waiting for the others...':'Poll closed. Waiting for the next poll...'}</p></div>`;
  if(!p.open)return v.innerHTML=head+'<div class="center card"><h1>Poll closed</h1><p class="mut">Waiting for the next poll...</p></div>';
  v.innerHTML=head+`<div class="title">${esc(p.title)}</div><div class="grid" id="g">${Array.from({length:101},(_,i)=>`<button class="dot" style="--h:${Math.round(i*2.9)}" data-v="${i}">${i}</button>`).join('')}</div>`;
  $('g').onclick=e=>{const b=e.target.closest('.dot');if(!b)return;p.votes[S.me]=+b.dataset.v;save();};
}
function admin(){
  const p=cur();
  $('n').textContent=p?`Poll ${S.polls.length} - ${p.open?'OPEN':'CLOSED'}`:'No poll started yet';
  $('t').textContent=p?p.title:'Press "Next Poll" to start';
  $('c').textContent=p?Object.keys(p.votes).length:0; $('j').textContent=S.people.length+' joined';
  $('a').textContent=p&&avg(p)!==null?avg(p)+'%':'-'; $('close').disabled=!(p&&p.open);
  $('p').innerHTML=S.people.map(n=>`<span class="chip ${p&&n in p.votes?'ok':''}">${esc(n)}${p&&n in p.votes?' ✓':''}</span>`).join('')||'<span class="mut">Nobody yet</span>';
}
function draw(){phone();admin();}
$('next').onclick=()=>{const p=cur();if(p)p.open=false;S.polls.push({title:TITLES[S.polls.length]||'Poll '+(S.polls.length+1),open:true,votes:{}});save();};
$('close').onclick=()=>{const p=cur();if(p){p.open=false;save();}};
$('sim').onclick=()=>{const p=cur();if(!p||!p.open)return alert('Start a poll first (Next Poll).');
  NAMES.forEach(n=>{if(!S.people.includes(n))S.people.push(n);if(!(n in p.votes))p.votes[n]=Math.round(40+Math.random()*60*Math.random()+Math.random()*30)%101;});save();};
$('reset').onclick=()=>{S=fresh();save();};
$('csv').onclick=()=>{const q=c=>'"'+String(c).replace(/"/g,'""')+'"';
  const r=[['Poll #','Question','Name','Vote (0-100)']];S.polls.forEach((p,i)=>Object.entries(p.votes).forEach(([n,v])=>r.push([i+1,p.title,n,v])));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+r.map(x=>x.map(q).join(',')).join('\r\n')],{type:'text/csv'}));
  a.download='poll-results.csv';a.click();};
draw();
</script>
